<!-- HOMEPAGE (/) — page Code → Head -->
<!-- the site's name for search results and link previews. Super writes the page's full title into its own og:site_name,
     ahead of this tag, and has no setting for it, so the homepage gave Google two names. The script puts the one name in
     both (the observer because hydration can write Super's back); Google reads a page after its scripts run. It only
     serves a fresh load, so it sits here and not in the site head. docs/seo.md, "The site's name" -->
<meta property="og:site_name" content="Encapsulate" />
<script>
(function () {
  function name() {
    if (location.pathname !== "/") return;
    document.querySelectorAll('meta[property="og:site_name"]').forEach(function (m) {
      if (m.getAttribute("content") !== "Encapsulate") m.setAttribute("content", "Encapsulate");
    });
  }
  name();
  new MutationObserver(name).observe(document.head, { childList: true });
})();
</script>
<!-- structured data (2026-09-27): who we are, for search engines — the site's own facts (the legal
     name and email from the legal pages, "since 2020", the footer's social links, the favicon as
     the logo). The site name here is what Google shows above a result. -->
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"Organization","@id":"https://encapsulate.xyz/#organization","name":"Encapsulate","legalName":"Encapsulate Limited",
  "url":"https://encapsulate.xyz/","logo":"https://assets.super.so/d7300a44-6aa9-4b9e-a149-0076eb69ca9d/uploads/favicon/5e58bb1b-9402-467d-94ed-606ab66894a0.png",
  "description":"Validator infrastructure for new chains, from the first testnet through mainnet.",
  "foundingDate":"2020","email":"hello@encapsulate.xyz",
  "sameAs":["https://x.com/encapHQ","https://www.linkedin.com/company/encapsulate-xyz","https://github.com/encapsulate-xyz","https://discord.gg/PQJX5JVS8h"]},
 {"@type":"WebSite","@id":"https://encapsulate.xyz/#website","name":"Encapsulate","alternateName":["Encapsulate Validators","Encapsulate Limited"],"url":"https://encapsulate.xyz/",
  "publisher":{"@id":"https://encapsulate.xyz/#organization"}}
]}
</script>
