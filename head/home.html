<!-- HOMEPAGE (/) — page Code → Head -->
<!-- the site's name for search results and link previews (Super writes the page title into its own og:site_name) -->
<meta property="og:site_name" content="Encapsulate" />
<!-- structured data (2026-09-27): who we are, for search engines — the site's own facts (the legal
     name and email from the legal pages, "since 2020", the footer's social links, the favicon as
     the logo). The site name here is what Google shows above a result. -->
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"Organization","@id":"https://encapsulate.xyz/#organization","name":"Encapsulate","legalName":"Encapsulate Limited",
  "url":"https://encapsulate.xyz/","logo":"https://assets.super.so/d7300a44-6aa9-4b9e-a149-0076eb69ca9d/uploads/favicon/5e58bb1b-9402-467d-94ed-606ab66894a0.png",
  "description":"Validator infrastructure for new chains, from the first testnet through mainnet.",
  "foundingDate":"2020","email":"hello@encapsulate.xyz",
  "sameAs":["https://x.com/encapHQ","https://www.linkedin.com/company/encapsulate-xyz","https://github.com/encapsulate-xyz","https://discord.gg/PQJX5JVS8h"]},
 {"@type":"WebSite","@id":"https://encapsulate.xyz/#website","name":"Encapsulate","url":"https://encapsulate.xyz/",
  "publisher":{"@id":"https://encapsulate.xyz/#organization"}}
]}
</script>

<!-- the hero's still (the loop's first frame), fetched early: it is the first thing the hero paints. ALWAYS THE SAME TAG
     AS home.css below — home.css draws it from ../img/ on its own tag, so a preload on another tag fetches a file the
     page never uses (it sat on v334 while home.css moved on to v401: PageSpeed, 2026-10-25). build.py checks it. -->
<link rel="preload" as="image" href="https://cdn.jsdelivr.net/gh/encapsulate-xyz/website-css@v419/img/home-loop-poster.webp" fetchpriority="high">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/encapsulate-xyz/website-css@v419/dist/home.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/encapsulate-xyz/website-css@v401/dist/home-dial.css">
<link rel="canonical" href="https://encapsulate.xyz/">
